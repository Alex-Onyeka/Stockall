  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  lottie: ^3.3.1
  fl_chart: ^0.71.0
  intl: ^0.20.2
  supabase_flutter: ^2.8.4
  smooth_page_indicator: ^1.2.1
  flutter_polygon_clipper: ^1.0.0
  pin_code_fields: ^8.0.1
  flutter_svg: ^2.1.0
  # simple_barcode_scanner: ^0.3.0
  table_calendar: ^3.2.0
  shimmer: ^3.0.0
  http: ^1.4.0
  # flutter_native_splash: ^2.4.6
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  audioplayers: ^6.4.0
  intl_phone_field: ^3.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5
  url_launcher: ^6.3.1
  web: ^1.1.1
  restart_app: ^1.3.2
  uuid: ^4.5.1
  pdf: ^3.11.3
  universal_html: ^2.2.4
  mobile_scanner: ^7.0.1
  open_file: ^3.5.10
  # flutter_thermal_printer: ^1.2.1+1
  flutter_usb_thermal_plugin: ^0.0.1+1
  rxdart: ^0.28.0
  printing: ^5.14.2
  file_saver: ^0.3.1
  permission_handler: ^12.0.1
  image_picker: ^1.2.0
  internet_connection_checker: ^3.0.1
  popover: ^0.4.0
  barcode_widget: ^2.0.4
  barcode: ^2.2.9
  image: ^4.5.4
  flutter_inappwebview: ^6.1.5
  desktop_multi_window: ^0.2.1
  screen_retriever: ^0.1.9
  win32: ^5.15.0
  ffi: ^2.1.5
  window_manager: ^0.4.2
  bluetooth_print_plus: ^2.4.6
  device_info_plus: ^12.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  msix: ^3.6.2
  # flutter_launcher_icons: ^0.14.3
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# dependency_overrides:
#   printing:
#     git:
#       url: https://github.com/DavBfr/dart_pdf
#       ref: main
#       path: printing
msix_config:
  display_name: Stockall
  publisher_display_name: Stockall Solutions
  identity_name: StockallSolutions.Stockall
  msix_version: 1.7.66.0
  logo_path: assets/images/logos/fav_icon.png
  start_menu_icon_path: assets/images/logos/fav_icon.png
  tile_icon_path: assets/images/logos/fav_icon.png
  capabilities: internetClient
  publisher: CN=C30F1185-CC3C-46C0-BCF0-18DA02C31DC5
  certificate_path: windows/certificates/stockallsolutions.pfx
  certificate_password: myuzician


# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/animations/
    - assets/images/logos/
    - assets/svgs/
    - assets/images/main_images/
    - assets/images/small_images/
    - assets/audio/short/
    - assets/fonts/PlusJakartaSans-Regular.ttf
    - assets/fonts/PlusJakartaSans-Bold.ttf
  # - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logos/fav_icon.png
  web:
    generate: true
    image_path: assets/images/logos/fav_icon.png
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/images/logos/fav_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/images/logos/fav_icon.png
  linux:
    generate: true
    image_path: assets/images/logos/fav_icon.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logos/logo_icon_splash.png
  android: true
  ios: true
  fullscreen: true 
  # Control image size and positioning
  android_gravity: center
  ios_content_mode: center


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
